<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - AcademySync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="{{ url_for('static', filename='edge-academy-logo.png') }}" alt="Edge Academy Logo" class="login-logo">
                <h1>Recuperar Senha</h1>
                <p>Insira seu nome de usuário para redefinir sua senha.</p>
            </div>
            <div class="login-body-content">
                <form method="post">
                    <div class="form-group">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" id="username" name="username" class="form-input" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Redefinir Senha</button>
                </form>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="flash-messages" style="margin-top: 20px;">
                    {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <p style="text-align: center; margin-top: 20px; color: #6c757d;">
                    Lembrou da senha? <a href="{{ url_for('login') }}">Voltar para o Login</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
