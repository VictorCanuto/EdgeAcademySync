<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir Nova Senha - AcademySync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="{{ url_for('static', filename='edge-academy-logo.png') }}" alt="Edge Academy Logo" class="login-logo">
                <h1>Nova Senha</h1>
                <p>Crie uma nova senha de acesso para sua conta.</p>
            </div>
            <div class="login-body-content">
                <form method="post">
                    <div class="form-group">
                        <label for="new_password" class="form-label">Nova Senha</label>
                        <input type="password" id="new_password" name="new_password" class="form-input" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password" class="form-label">Confirmar Nova Senha</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-input" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Salvar Nova Senha</button>
                </form>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="flash-messages" style="margin-top: 20px;">
                    {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <p style="text-align: center; margin-top: 20px; color: #6c757d;">
                    <a href="{{ url_for('login') }}">Voltar para o Login</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
