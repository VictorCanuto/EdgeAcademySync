<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir Nova Senha - AcademySync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="main-header">
        <a href="" class="logo-container">
            <div class="logo-block">
                <img class="logo" src="{{ url_for('static', filename='images/edge-academy-horizontal-logo.png') }}"/>
            </div>
            <p class="logo-subtext">AcademySync</p>
        </a>
    </header>

    <main class="auth-container">
        <div class="glass-panel auth-card">
            <div class="auth-header">
                <h2>Nova Senha</h2>
                <p>Crie uma nova senha de acesso para sua conta.</p>
            </div>
            
            <form method="post">
                <div class="form-group">
                    <label class="form-label" for="new_password">Nova Senha</label>
                    <input type="password" id="new_password" name="new_password" class="form-input" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirmar Nova Senha</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Repita a senha" required minlength="6">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">Salvar Nova Senha</button>
            </form>

            <div class="form-footer">
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    <a href="{{ url_for('login') }}">Voltar para o Login</a>
                </p>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-messages-container"></div>
    <script>
        function showToast(title, desc, type = 'info') {
            const container = document.getElementById('toast-messages-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            let icon = '⚠️';
            let border = 'var(--color-danger)';
            
            if (type === 'success') { icon = '✅'; border = 'var(--color-success)'; }
            else if (type === 'info') { icon = 'ℹ️'; border = 'var(--color-secondary)'; }
            
            toast.style.borderLeftColor = border;
            toast.innerHTML = `
                <div style="font-size: 1.2rem;">${icon}</div>
                <div class="toast-content">
                    <h5>${title}</h5>
                    <p>${desc}</p>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    let cat = '{{ category }}';
                    let type = cat === 'error' || cat === 'danger' ? 'danger' : (cat === 'success' ? 'success' : 'info');
                    showToast(type === 'danger' ? 'Erro' : 'Notificação', '{{ message }}', type);
                {% endfor %}
            {% endif %}
            {% endwith %}

            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
        });
    </script>
</body>
</html>
