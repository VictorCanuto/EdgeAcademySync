<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AcademySync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
</head>
<body>

    <!-- Header simplificado para login/cadastro -->
    <header class="main-header">
        <div class="logo-block">
            <div class="logo-icon">A</div>
            <div class="logo-text">
                <h1>AcademySync</h1>
                <p>Edge Academy Study Groups</p>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="glass-panel auth-card">
            <div class="auth-header">
                <h2>Acesse sua conta</h2>
                <p>Entre com seus dados do AcademySync</p>
            </div>
            
            <form method="post">
                <div class="form-group">
                    <label class="form-label" for="username_or_email">Usuário ou E-mail</label>
                    <input type="text" id="username_or_email" name="username_or_email" class="form-input" placeholder="Nome de usuário ou e-mail" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" tabindex="-1" onclick="togglePasswordVisibility('password', this)" title="Mostrar/Ocultar Senha">
                            <!-- Olho Aberto (Mostrar Senha) - Oculto por padrão -->
                            <svg class="eye-open" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <!-- Olho Fechado (Ocultar Senha) - Visível por padrão -->
                            <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div style="text-align: right; margin-bottom: 15px;">
                    <a href="{{ url_for('forgot_password') }}" style="color: var(--color-primary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Entrar</button>
            </form>

            <div class="form-footer">
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    Não tem uma conta? <a href="{{ url_for('register') }}">Registre-se</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Container para Toasts de erro se houver mensagens flash -->
    <div class="toast-container" id="toast-messages-container"></div>
    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const eyeOpen = btn.querySelector('.eye-open');
            const eyeClosed = btn.querySelector('.eye-closed');
            
            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            } else {
                input.type = 'password';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            }
        }

        // Função simples para exibir toast na tela de login
        function showToast(title, desc, type = 'info') {
            const container = document.getElementById('toast-messages-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            let icon = '⚠️';
            let border = 'var(--color-danger)';
            
            if (type === 'success') { icon = '✅'; border = 'var(--color-success)'; }
            else if (type === 'info') { icon = 'ℹ️'; border = 'var(--color-secondary)'; }
            
            toast.style.borderLeftColor = border;
            toast.innerHTML = `
                <div style="font-size: 1.2rem;">${icon}</div>
                <div class="toast-content">
                    <h5>${title}</h5>
                    <p>${desc}</p>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Verificar mensagens flash injetadas pelo Flask
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    let cat = '{{ category }}';
                    let type = cat === 'error' || cat === 'danger' ? 'danger' : (cat === 'success' ? 'success' : 'info');
                    showToast(type === 'danger' ? 'Erro de Acesso' : 'Notificação', '{{ message }}', type);
                {% endfor %}
            {% endif %}
            {% endwith %}

            // Aplicar preferência de modo escuro salva no localStorage
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
        });
    </script>
</body>
</html>
