<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AcademySync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="main-header">
        <div class="logo-block">
            <div class="logo-icon">A</div>
            <div class="logo-text">
                <h1>AcademySync</h1>
                <p>Edge Academy Study Groups</p>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="glass-panel auth-card">
            <div class="auth-header">
                <h2>Criar nova conta</h2>
                <p>Crie sua conta corporativa no AcademySync</p>
            </div>
            
            <form method="post">
                <div class="form-group">
                    <label class="form-label" for="username">Usuário</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Nome de usuário" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">E-mail corporativo</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="exemplo@edge.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Mínimo 8 caracteres" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="security_question">Pergunta de Segurança</label>
                    <select id="security_question" name="security_question" class="form-input" required onchange="toggleCustomQuestion(this, 'custom-question-container')">
                        <option value="Qual o nome do seu primeiro animal de estimação?">Qual o nome do seu primeiro animal de estimação?</option>
                        <option value="Qual o nome da rua onde você cresceu?">Qual o nome da rua onde você cresceu?</option>
                        <option value="Qual a sua cidade natal?">Qual a sua cidade natal?</option>
                        <option value="Qual o nome da sua primeira escola?">Qual o nome da sua primeira escola?</option>
                        <option value="Qual a sua comida favorita da infância?">Qual a sua comida favorita da infância?</option>
                        <option value="custom">Escrever minha própria pergunta...</option>
                    </select>
                </div>
                
                <div class="form-group" id="custom-question-container" style="display: none;">
                    <label class="form-label" for="custom_question_text">Sua Pergunta Personalizada</label>
                    <input type="text" id="custom_question_text" name="custom_question_text" class="form-input" placeholder="Ex: Qual o ano do meu primeiro carro?">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="security_answer">Resposta de Segurança</label>
                    <input type="text" id="security_answer" name="security_answer" class="form-input" placeholder="Sua resposta segura" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">Criar Conta</button>
            </form>

            <div class="form-footer">
                <p style="color: var(--text-muted); font-size: 0.9rem;">
                    Já tem uma conta? <a href="{{ url_for('login') }}">Faça login</a>
                </p>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-messages-container"></div>
    <script>
        function showToast(title, desc, type = 'info') {
            const container = document.getElementById('toast-messages-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            let icon = '⚠️';
            let border = 'var(--color-danger)';
            
            if (type === 'success') { icon = '✅'; border = 'var(--color-success)'; }
            else if (type === 'info') { icon = 'ℹ️'; border = 'var(--color-secondary)'; }
            
            toast.style.borderLeftColor = border;
            toast.innerHTML = `
                <div style="font-size: 1.2rem;">${icon}</div>
                <div class="toast-content">
                    <h5>${title}</h5>
                    <p>${desc}</p>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        function toggleCustomQuestion(selectElement, containerId) {
            const container = document.getElementById(containerId);
            const inputField = container.querySelector('input');
            if (selectElement.value === 'custom') {
                container.style.display = 'block';
                inputField.setAttribute('required', 'required');
            } else {
                container.style.display = 'none';
                inputField.removeAttribute('required');
                inputField.value = '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    let cat = '{{ category }}';
                    let type = cat === 'error' || cat === 'danger' ? 'danger' : (cat === 'success' ? 'success' : 'info');
                    showToast(type === 'danger' ? 'Erro de Cadastro' : 'Notificação', '{{ message }}', type);
                {% endfor %}
            {% endif %}
            {% endwith %}

            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
        });
    </script>
</body>
</html>
